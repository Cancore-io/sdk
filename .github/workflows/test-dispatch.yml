name: Tests on demand

# CAN-3346: ci.yml runs no unit tests (CAN-2934), and publish.yml runs them only
# right before it publishes. This workflow runs the same unit suite against a PR
# head or a ref on request, and nothing else: no publish step, no secret, a
# read-only token.
#
# CAN-3669: local test runs are banned, so a run of this workflow is the
# evidence a ticket needs for In Testing. `grep` (jest -t) is required: a run
# covers one ticket's tests, never the full suite by default, and a run where
# it matches no test fails.
#
# The `pull_request` trigger is limited to this file: a change to the workflow
# itself proves it on its own PR, since workflow_dispatch exists only once the
# file is on the default branch. Every other PR is tested by dispatch alone.
run-name: ${{ github.event_name == 'pull_request' && 'Tests on demand (workflow change)' || format('Tests {0} @ {1} ({2})', inputs.grep, inputs.pr && format('PR {0}', inputs.pr) || inputs.ref, inputs.suite) }}

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test-name pattern (jest -t), e.g. CAN-3017 or TC-SDK-3017'
        required: true
        type: string
      suite:
        description: 'unit = npm test; integration = npm run test:int as ci.yml runs it (stand suites skip without a stand)'
        type: choice
        options: [unit, integration, both]
        default: unit
      pr:
        description: 'PR number: its head (refs/pull/<n>/head) is tested, instead of ref'
        required: false
        type: string
      ref:
        description: 'A sha or branch, when no PR number is given'
        required: false
        default: main
        type: string
  pull_request:
    paths: ['.github/workflows/test-dispatch.yml']

permissions:
  contents: read

concurrency:
  group: sdk-tests-${{ inputs.pr || inputs.ref || github.ref }}-${{ inputs.grep }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  tests:
    # ubuntu-latest, not cancore-runners: a PR head may come from a fork (ci.yml, CAN-1120).
    runs-on: ubuntu-latest
    # publish.yml runs install, build and the unit suite in under 2 minutes; 30 covers a cold cache with room.
    timeout-minutes: 30
    env:
      # ubuntu-latest has 16 GB; two jest workers and the parent stay well inside 6 GB each.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: What to test
        id: target
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          GREP: ${{ inputs.grep }}
          SUITE: ${{ inputs.suite }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            # A pull_request run has no inputs: it proves the filter on unit tests that exist on every branch.
            { echo "ref="; echo "grep=TC-SDK-2352"; echo "suite=unit"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ -n "${GREP// /}" ]] || { echo "::error::grep is required: a full-suite run is never the default"; exit 1; }
          { echo "grep=$GREP"; echo "suite=$SUITE"; } >> "$GITHUB_OUTPUT"
          if [[ -n "$PR" ]]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a PR number, got '$PR'"; exit 1; }
            echo "ref=refs/pull/$PR/head" >> "$GITHUB_OUTPUT"
          elif [[ -n "$REF" ]]; then
            [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::ref must be a sha or a branch name, got '$REF'"; exit 1; }
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "::error::give pr or ref"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The same commands as publish.yml, up to its publish step.
      - run: pnpm install --frozen-lockfile
      # Build before test: the bundle-isolation tests read dist (as in publish.yml).
      - run: npm run build
      - name: Unit tests matching ${{ steps.target.outputs.grep }}
        if: steps.target.outputs.suite != 'integration'
        env:
          GREP: ${{ steps.target.outputs.grep }}
          JEST_JUNIT_OUTPUT_FILE: rp-reports/sdk-unit.xml
        run: |
          set -euo pipefail
          # GNU time reports the peak RSS of the largest single process: the jest parent or one worker.
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" npm test -- -t "$GREP" --maxWorkers=2 --reporters=default --reporters=jest-junit --json --outputFile="$RUNNER_TEMP/unit.json"
      # The int project as ci.yml `check` runs it: suites against a local stand skip themselves without its artifacts.
      - name: Integration tests matching ${{ steps.target.outputs.grep }}
        if: ${{ !cancelled() && steps.target.outputs.suite != 'unit' }}
        env:
          GREP: ${{ steps.target.outputs.grep }}
          JEST_JUNIT_OUTPUT_FILE: rp-reports-int/sdk-int-dispatch.xml
        run: npm run test:int -- -t "$GREP" --reporters=default --reporters=jest-junit --json --outputFile="$RUNNER_TEMP/int.json"

      # jest passes when -t matches nothing: that is no evidence for the ticket.
      - name: Summary
        if: ${{ !cancelled() }}
        env:
          GREP: ${{ steps.target.outputs.grep }}
        run: |
          set -euo pipefail
          {
            echo "### Tests matching \`$GREP\` at \`$(git rev-parse HEAD)\`"
            for suite in unit int; do
              [[ -f "$RUNNER_TEMP/$suite.json" ]] || continue
              # shellcheck disable=SC2016 # the single quotes hold JavaScript template literals, not shell.
              node -e '
                const r = require(process.argv[1]);
                console.log(`- ${process.argv[2]}: ${r.numPassedTests} passed, ${r.numFailedTests} failed, ${r.numPendingTests} skipped of ${r.numTotalTests}`);
              ' "$RUNNER_TEMP/$suite.json" "$suite"
            done
            if [[ -f "$RUNNER_TEMP/time.txt" ]]; then
              grep -E 'Elapsed \(wall clock\)|Maximum resident set size' "$RUNNER_TEMP/time.txt" | sed 's/^\s*/- /'
            fi
          # Also in the log: the job summary has no API, the log does.
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ran=0
          for f in "$RUNNER_TEMP"/unit.json "$RUNNER_TEMP"/int.json; do
            [[ -f "$f" ]] || continue
            ran=$((ran + $(node -e 'const r = require(process.argv[1]); console.log(r.numPassedTests + r.numFailedTests)' "$f")))
          done
          [[ "$ran" -gt 0 ]] || { echo "::error::no test name matches '$GREP'"; exit 1; }

      - name: Upload test reports for rp-collect
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp-reports-unit
          path: rp-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload integration reports for rp-collect
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp-reports-int
          path: rp-reports-int/
          if-no-files-found: ignore
          retention-days: 7
