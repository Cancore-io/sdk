name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scoped by workflow AND ref. `github.ref` differs between a pull_request run
# (refs/pull/N/merge) and a push run of the same commit, so a merge into main
# never cancels the check still running on the PR, or the other way round.
#
# main is excluded from cancellation on purpose, and not out of caution: a
# cancelled run has conclusion `cancelled`, not `failure`, so the CI-failure
# notifier — which fires on failure/timed_out — would never hear about it. Two
# merges in quick succession would silently swallow the first one's red run,
# which is the exact signal this repository is being wired to emit. The runner
# minutes this saves are all on PR branches anyway, where the expensive tarball
# step below runs on every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicit, rather than whatever the repository default grants. Nothing in this
# workflow writes: it installs, types, tests, builds and packs.
permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest, NOT the cancore-runners standard (CAN-1120). This is the
    # organization's only PUBLIC repository, and this workflow's `pull_request`
    # trigger runs code authored in forks — on a self-hosted runner that is
    # arbitrary code executing inside our network, the textbook way to lose a
    # runner. The standard is not violated by a documented exception; it is
    # violated by an undocumented one, so this is the record. Revisit only if
    # cancore-runners becomes ephemeral/isolated per job, or if fork PRs get a
    # workflow of their own.
    runs-on: ubuntu-latest
    # A hung `npm install` in the loop below would otherwise burn the default
    # six hours of a public repository's runner budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The mock gateway as a real process and a real WebSocket client (needs dist/).
      - run: npm run test:int

      # The check unit tests cannot do: pack the tarball and import it from a
      # project that is not this repository. A broken `exports` map, a file left
      # out of `files`, a missing type declaration — all of it passes every test
      # in the suite and fails the first person who runs `npm install`.
      #
      # EVERY subpath the manifest publishes, not just the root: a subpath entry
      # is exactly where an exports map breaks, and `@cancore/client/realtime`
      # would have been the fourth entry nothing here ever imported.
      - name: Install the tarball as a stranger would
        run: |
          set -euo pipefail
          # Pack everything first: a package that depends on a sibling
          # (@cancore/test-kit on @cancore/contracts) installs the sibling from
          # this tree, not from a registry that may not have the version yet.
          declare -A TARBALL
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            if [ "$(node -p "require('./$pkg/package.json').private === true")" = "true" ]; then continue; fi
            TARBALL[$name]="$RUNNER_TEMP/$(cd "$pkg" && npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          done
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            private=$(node -p "require('./$pkg/package.json').private === true")
            if [ "$private" = "true" ]; then echo "skip $name (private)"; continue; fi
            siblings=()
            for dep in $(node -p "Object.keys(require('./$pkg/package.json').dependencies ?? {}).filter((d) => d.startsWith('@cancore/')).join(' ')"); do
              siblings+=("${TARBALL[$dep]}")
            done
            rm -rf "$RUNNER_TEMP/consumer" && mkdir -p "$RUNNER_TEMP/consumer"
            cd "$RUNNER_TEMP/consumer"
            npm init -y >/dev/null
            npm install "${TARBALL[$name]}" "${siblings[@]}" --no-audit --no-fund
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              const manifest = JSON.parse(readFileSync('node_modules/$name/package.json', 'utf8'));
              for (const subpath of Object.keys(manifest.exports ?? { '.': {} })) {
                // a pattern such as ./spec/* names files, not a module: checked below
                if (subpath.includes('*')) continue;
                const specifier = '$name' + (subpath === '.' ? '' : subpath.slice(1));
                const names = Object.keys(await import(specifier));
                if (names.length === 0) throw new Error(specifier + ' exports nothing');
                console.log(specifier, 'exports:', names.join(', '));
              }
            "
            test -f "node_modules/$name/dist/index.d.ts" || { echo "$name ships no types"; exit 1; }
            if node -e "process.exit(require('./node_modules/$name/package.json').exports?.['./spec/*'] ? 0 : 1)"; then
              node --input-type=module -e "
                const { default: s } = await import('$name/spec/protocol/messages.schema.json', { with: { type: 'json' } });
                if (!s.\$defs) throw new Error('$name/spec/* does not resolve to the schemas');
                console.log('$name/spec/* ok:', Object.keys(s.\$defs).length, 'message defs');
              "
            fi
            cd "$GITHUB_WORKSPACE"
          done

      # B16: what another repository's CI does — the mock from the tarball, one
      # command, ready and healthy within five seconds.
      - name: Start the mock gateway as a stranger would
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/mock" && mkdir -p "$RUNNER_TEMP/mock" && cd "$RUNNER_TEMP/mock"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/cancore-contracts-*.tgz "$RUNNER_TEMP"/cancore-test-kit-*.tgz --no-audit --no-fund
          npx cancore-test-kit mock-gateway --port 0 --control 0 > ready.log 2> mock.err &
          pid=$!
          for _ in $(seq 50); do [ -s ready.log ] && break; sleep 0.1; done
          test -s ready.log || { echo "not ready in 5 s"; cat mock.err; exit 1; }
          control=$(node -p "JSON.parse(require('fs').readFileSync('ready.log', 'utf8').split('\\n')[0]).control")
          curl -fsS "$control/__mock/health"
          kill "$pid"

      - name: Build and run the mock gateway image
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP"/cancore-contracts-*.tgz "$RUNNER_TEMP"/cancore-test-kit-*.tgz packages/test-kit/
          docker build -t cancore-mock-gateway:ci packages/test-kit
          docker run -d --name mock -p 8787:8787 -p 8788:8788 cancore-mock-gateway:ci
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:8788/__mock/health && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8788/__mock/health >/dev/null || { docker logs mock; exit 1; }
          docker rm -f mock
