name: CI

on:
  push:
    branches: [main]
  pull_request:

# Scoped by workflow AND ref. `github.ref` differs between a pull_request run
# (refs/pull/N/merge) and a push run of the same commit, so a merge into main
# never cancels the check still running on the PR, or the other way round.
#
# main is excluded from cancellation on purpose, and not out of caution: a
# cancelled run has conclusion `cancelled`, not `failure`, so the CI-failure
# notifier — which fires on failure/timed_out — would never hear about it. Two
# merges in quick succession would silently swallow the first one's red run,
# which is the exact signal this repository is being wired to emit. The runner
# minutes this saves are all on PR branches anyway, where the expensive tarball
# step below runs on every push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Explicit, rather than whatever the repository default grants. Nothing in this
# workflow writes: it installs, types, tests, builds and packs.
permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest, NOT the cancore-runners standard (CAN-1120). This is the
    # organization's only PUBLIC repository, and this workflow's `pull_request`
    # trigger runs code authored in forks — on a self-hosted runner that is
    # arbitrary code executing inside our network, the textbook way to lose a
    # runner. The standard is not violated by a documented exception; it is
    # violated by an undocumented one, so this is the record. Revisit only if
    # cancore-runners becomes ephemeral/isolated per job, or if fork PRs get a
    # workflow of their own.
    runs-on: ubuntu-latest
    # A hung `npm install` in the loop below would otherwise burn the default
    # six hours of a public repository's runner budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The committed vectors must be what the generators produce: a hand-edited
      # or stale spec file fails here instead of shipping (CAN-2496 review F-2).
      - name: Vectors are regenerated, not hand-edited
        run: npm run vectors -w @cancore/contracts && git diff --exit-code packages/contracts/spec
      # Suites against a local stand skip themselves without its artifacts here; the `stand` job runs the anvil ones.
      - run: npm run test:int

      # The check unit tests cannot do: pack the tarball and import it from a
      # project that is not this repository. A broken `exports` map, a file left
      # out of `files`, a missing type declaration — all of it passes every test
      # in the suite and fails the first person who runs `npm install`.
      #
      # EVERY subpath the manifest publishes, not just the root: a subpath entry
      # is exactly where an exports map breaks, and `@cancore/client/realtime`
      # would have been the fourth entry nothing here ever imported.
      - name: Install the tarball as a stranger would
        run: |
          set -euo pipefail
          # Pack everything first: a package that depends on a sibling — as a
          # dependency (@cancore/trader on @cancore/contracts) or as a peer
          # (@cancore/client on @cancore/wallet) — installs the sibling from
          # this tree, not from a registry that may not have the version yet.
          declare -A TARBALL
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            if [ "$(node -p "require('./$pkg/package.json').private === true")" = "true" ]; then continue; fi
            TARBALL[$name]="$RUNNER_TEMP/$(cd "$pkg" && npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          done
          for pkg in packages/*/; do
            name=$(node -p "require('./$pkg/package.json').name")
            private=$(node -p "require('./$pkg/package.json').private === true")
            if [ "$private" = "true" ]; then echo "skip $name (private)"; continue; fi
            siblings=()
            for dep in $(node -p "((p) => Object.keys({ ...p.dependencies, ...p.peerDependencies }))(require('./$pkg/package.json')).filter((d) => d.startsWith('@cancore/')).join(' ')"); do
              siblings+=("${TARBALL[$dep]}")
            done
            rm -rf "$RUNNER_TEMP/consumer" && mkdir -p "$RUNNER_TEMP/consumer"
            cd "$RUNNER_TEMP/consumer"
            npm init -y >/dev/null
            npm install "${TARBALL[$name]}" "${siblings[@]}" --no-audit --no-fund
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              const manifest = JSON.parse(readFileSync('node_modules/$name/package.json', 'utf8'));
              for (const subpath of Object.keys(manifest.exports ?? { '.': {} })) {
                // a pattern such as ./spec/* names files, not a module: checked below
                if (subpath.includes('*')) continue;
                const specifier = '$name' + (subpath === '.' ? '' : subpath.slice(1));
                const names = Object.keys(await import(specifier));
                if (names.length === 0) throw new Error(specifier + ' exports nothing');
                console.log(specifier, 'exports:', names.join(', '));
              }
            "
            if [ "$name" = "@cancore/contracts" ]; then
              node --input-type=module -e "
                import { deepStrictEqual } from 'node:assert/strict';
                const events = {
                  Filled: [
                    ['orderHash', 'bytes32', true], ['fillerId', 'bytes32', true],
                    ['deliveryKey', 'address', false], ['repayTo', 'bytes32', false],
                    ['received', 'uint256', false], ['recipient', 'bytes32', false],
                    ['filledAt', 'uint64', false], ['attempt', 'uint32', false],
                  ],
                  Settled: [
                    ['orderHash', 'bytes32', true], ['fillerId', 'bytes32', true],
                    ['repayTo', 'bytes32', false], ['payout', 'uint256', false], ['fee', 'uint256', false],
                  ],
                };
                const check = (abi, label) => {
                  for (const [name, fields] of Object.entries(events)) {
                    const matches = abi.filter((entry) => entry.type === 'event' && entry.name === name);
                    deepStrictEqual(matches.length, 1, label + ': ' + name);
                    deepStrictEqual(matches[0].anonymous, false, label + ': ' + name + ' anonymous');
                    deepStrictEqual(matches[0].inputs.map(({ name, type, indexed }) => [name, type, indexed]), fields, label + ': ' + name);
                  }
                };
                for (const subpath of ['', '/abi']) {
                  const exports = await import('@cancore/contracts' + subpath);
                  for (const name of ['CANCORE_ROUTER_ABI', 'ICANCORE_ROUTER_ABI']) check(exports[name], subpath + ':' + name);
                }
                for (const name of ['CancoreRouter', 'ICancoreRouter']) {
                  const { default: abi } = await import('@cancore/contracts/spec/abi/' + name + '.json', { with: { type: 'json' } });
                  check(abi, 'spec/abi/' + name);
                }
                console.log('packed contracts: variant A Filled/Settled exports and spec match');
              "
              node "$GITHUB_WORKSPACE/packages/contracts/scripts/check-packed-order.mjs" "$PWD"
            fi
            # Every subpath ships its declarations — not just a root entry, which
            # a package such as @cancore/trader (subpaths only) does not have.
            node --input-type=module -e "
              import { existsSync, readFileSync } from 'node:fs';
              const manifest = JSON.parse(readFileSync('node_modules/$name/package.json', 'utf8'));
              const targets = Object.entries(manifest.exports ?? {}).filter(([subpath]) => !subpath.includes('*'));
              if (targets.length === 0) targets.push(['.', { types: manifest.types }]);
              for (const [subpath, target] of targets) {
                const types = typeof target === 'object' ? target.types : undefined;
                if (!types || !existsSync('node_modules/$name/' + types)) throw new Error('$name ' + subpath + ' ships no types');
              }
            "
            if node -e "process.exit(require('./node_modules/$name/package.json').exports?.['./spec/*'] ? 0 : 1)"; then
              node --input-type=module -e "
                const { default: s } = await import('$name/spec/protocol/messages.schema.json', { with: { type: 'json' } });
                if (!s.\$defs) throw new Error('$name/spec/* does not resolve to the schemas');
                console.log('$name/spec/* ok:', Object.keys(s.\$defs).length, 'message defs');
              "
            fi
            cd "$GITHUB_WORKSPACE"
          done

      # A filler node is a Node program, so @cancore/trader may use Node types in
      # its own tsconfig — but its published declarations must not need them, nor
      # DOM: a consumer with neither, and with skipLibCheck off, must typecheck
      # against both entries (CAN-1843).
      - name: Typecheck @cancore/trader as a stranger with no Node or DOM types
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/trader-types" && mkdir -p "$RUNNER_TEMP/trader-types" && cd "$RUNNER_TEMP/trader-types"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install "$RUNNER_TEMP"/cancore-trader-*.tgz "$RUNNER_TEMP"/cancore-contracts-*.tgz --no-audit --no-fund
          test ! -e node_modules/@types/node || { echo "@types/node arrived with @cancore/trader"; exit 1; }
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "strict": true, "noEmit": true, "target": "ES2022", "lib": ["ES2022"],
              "module": "NodeNext", "moduleResolution": "NodeNext", "types": [], "skipLibCheck": false },
            "files": ["consumer.ts"] }
          JSON
          cat > consumer.ts <<'TS'
          import { createFiller, type Filler, type FillerConfig, type FillerStore, type WebSocketFactory } from '@cancore/trader/filler';
          import { InMemoryFillerStore, createFakeWebSocketFactory } from '@cancore/trader/filler/testing';
          const store: FillerStore = new InMemoryFillerStore();
          const webSocket: WebSocketFactory = createFakeWebSocketFactory().factory;
          export const build = (config: Omit<FillerConfig, 'store' | 'webSocket'>): Filler => createFiller({ ...config, store, webSocket });
          TS
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" -p .

  # The integration suites of @cancore/trader against a real CancoreRouter (operator decision Ыу-1, CAN-1846):
  # an anvil without a fork, the router, Permit2 and test tokens deployed from the build committed in
  # packages/trader/test/stand/artifacts.json (evm-contracts is private; this job needs no secret, so a fork's PR
  # runs it too), one intent opened, filled and settled, then the suites — none of them may skip.
  # ubuntu-latest for the reason given on `check` (CAN-1120).
  stand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # anvil from the foundry release tarball, pinned by its sha256 (the release asset digest): no installer script.
      - name: Install anvil (foundry v1.8.3)
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/foundry.tgz" https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz
          echo "7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568  $RUNNER_TEMP/foundry.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/foundry" && tar -xzf "$RUNNER_TEMP/foundry.tgz" -C "$RUNNER_TEMP/foundry" anvil
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: Start anvil without a fork
        run: |
          nohup anvil --chain-id 11155111 --port 8545 > "$RUNNER_TEMP/anvil.log" 2>&1 &
          for _ in $(seq 1 100); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/anvil.log"; exit 1
      - run: npm run build -w @cancore/contracts
      - name: Deploy, configure, and drive one intent open -> fill -> settle
        run: node packages/trader/test/stand/up.mjs "$RUNNER_TEMP/stand"
      - name: Integration suites against the stand, none skipped
        env:
          CANCORE_INTENT_JSON: ${{ runner.temp }}/stand/intent.json
          CANCORE_ACTORS_ENV: ${{ runner.temp }}/stand/local-actors.env
        run: |
          npx jest --selectProjects int --runInBand --json --outputFile="$RUNNER_TEMP/int.json" \
            packages/trader/test/router.int.test.ts packages/trader/test/escrow.int.test.ts \
            packages/trader/test/executor.int.test.ts packages/trader/test/settle.int.test.ts
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/int.json');
            console.log(r.numTotalTestSuites, 'suites,', r.numPassedTests, 'passed,', r.numPendingTests + r.numTodoTests, 'skipped');
            if (r.numTotalTestSuites !== 4 || r.numPendingTests + r.numTodoTests > 0 || r.numPassedTests === 0) process.exit(1);
          "

  # Transaction pricing and nonce allocation of @cancore/trader against a real node (CAN-2299, CAN-2636): an anvil of its own, no contracts and no
  # secret. The suite toggles automine, so no other suite shares this anvil. ubuntu-latest for the reason given on
  # `check` (CAN-1120).
  anvil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # anvil from the foundry release tarball, pinned by its sha256 (the release asset digest): no installer script.
      - name: Install anvil (foundry v1.8.3)
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/foundry.tgz" https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz
          echo "7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568  $RUNNER_TEMP/foundry.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/foundry" && tar -xzf "$RUNNER_TEMP/foundry.tgz" -C "$RUNNER_TEMP/foundry" anvil
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: Start anvil
        run: |
          nohup anvil --port 8545 > "$RUNNER_TEMP/anvil.log" 2>&1 &
          for _ in $(seq 1 100); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 >/dev/null && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/anvil.log"; exit 1
      - name: Replacement cap, nonce counter and missing blocks against anvil, none skipped
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545
        run: |
          npx jest --selectProjects int --runInBand --verbose --json --outputFile="$RUNNER_TEMP/int.json" packages/trader/test/replacement.int.test.ts packages/trader/test/nonce.int.test.ts packages/trader/test/missing-block.int.test.ts
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/int.json');
            console.log(r.numPassedTests, 'passed,', r.numPendingTests + r.numTodoTests, 'skipped');
            if (r.numTotalTestSuites !== 3 || r.numPendingTests + r.numTodoTests > 0 || r.numPassedTests === 0) process.exit(1);
          "

  # CAN-2331: the published @cancore/contracts, installed from the npm registry into a stranger's project, and its
  # devnet routers read on their own chains over public RPCs (read-only, no key, no secret). The manifest's version
  # when the registry has it, else `next`. ubuntu-latest for the reason given on `check` (CAN-1120).
  deployments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install @cancore/contracts from the registry
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/contracts/package.json').version")
          if npm view "@cancore/contracts@$version" version >/dev/null 2>&1; then spec="$version"; else spec=next; fi
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "@cancore/contracts@$spec" --no-audit --no-fund
          node -p "'installed @cancore/contracts@' + require('./node_modules/@cancore/contracts/package.json').version"
      - name: Dev routers of the installed package on their chains, none skipped
        env:
          CANCORE_CONTRACTS_INSTALLED: ${{ runner.temp }}/consumer
        run: |
          npx jest --selectProjects int --runInBand --verbose --json --outputFile="$RUNNER_TEMP/int.json" packages/contracts/src/deployments.int.test.ts
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/int.json');
            console.log(r.numPassedTests, 'passed,', r.numPendingTests + r.numTodoTests, 'skipped');
            if (r.numTotalTestSuites !== 1 || r.numPendingTests + r.numTodoTests > 0 || r.numPassedTests === 0) process.exit(1);
          "
