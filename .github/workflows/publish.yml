name: Publish

# Tag-driven, never manual: the tarball on npm has to be traceable to a commit
# somebody can read. `<package>-v<version>` so one repository can release two
# packages on their own clocks.
on:
  push:
    tags: ['*-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole credential. npm trusted publishing exchanges this OIDC token
      # for a short-lived publish right, so there is no NPM_TOKEN in this
      # repository to leak, rotate or forget — and no 2FA prompt a CI job cannot
      # answer, which is exactly what stopped the first attempt.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; 24 ships
          # both, and the version is printed below so a runner image that drifts
          # says so in the log rather than failing at the last step.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve the package this tag releases
        id: target
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/$pkg"
          test -d "$dir" || { echo "no such package: $dir (from tag $tag)"; exit 1; }
          # The tag and the manifest must agree, or the version on npm is not the
          # version the tag claims — and nobody can tell afterwards.
          manifest=$(node -p "require('./$dir/package.json').version")
          test "$manifest" = "$version" || { echo "tag says $version, $dir/package.json says $manifest"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./$dir/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        working-directory: ${{ steps.target.outputs.dir }}
        # No token, and no `--provenance`: with trusted publishing npm mints the
        # credential from the OIDC token and attaches provenance by itself.
        run: |
          echo "npm $(npm --version), node $(node --version)"
          npm publish --access public

      - name: Say what shipped
        run: |
          echo "### Published \`${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/${{ steps.target.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
